<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>声音库卡片布局 v2 设计稿</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0B0F0C; display:flex; justify-content:center; padding:24px; font-family:'Microsoft YaHei UI','Segoe UI',sans-serif; }
  .phone { width:412px; background:#0F1512; padding:0 0 10px; position:relative; overflow:hidden; }
  /* 状态栏 */
  .status { height:28px; display:flex; align-items:center; justify-content:space-between; padding:0 20px; color:#EAF2EC; font-size:11px; }
  /* AppBar */
  .appbar { height:60px; display:flex; align-items:center; justify-content:space-between; padding:0 16px 0 20px; }
  .appbar h1 { color:#EAF2EC; font-size:22px; font-weight:700; letter-spacing:.3px; }
  .actions { display:flex; gap:14px; align-items:center; }
  .badge { position:relative; }
  .badge i { position:absolute; top:-4px; right:-5px; background:#4CAF87; color:#0F1512; font-size:9px; font-weight:700;
             width:14px; height:14px; border-radius:7px; display:grid; place-items:center; font-style:normal; }
  /* 分组标题 */
  .group { display:flex; align-items:center; gap:8px; padding:4px 20px 10px 18px; }
  .group b { color:#EAF2EC; font-size:15.5px; font-weight:700; }
  .group em { font-style:normal; background:rgba(76,175,135,.10); color:#4CAF87; font-size:11.5px; font-weight:700;
              padding:2px 8px; border-radius:9px; }
  /* 网格 */
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 16px 18px; }
  /* 卡片 v2：四角结构 */
  .card { height:112px; border-radius:14px; border:1px solid rgba(234,242,236,.09); padding:10px 6px 8px 10px;
          display:flex; flex-direction:column; justify-content:space-between; position:relative; }
  .card .top { display:flex; align-items:flex-start; }
  .tile { width:44px; height:44px; border-radius:12px; display:grid; place-items:center; }
  .card .right { margin-left:auto; display:flex; align-items:center; gap:6px; }
  .check { width:26px; height:26px; border-radius:8px; border:1.3px solid rgba(157,179,166,.35);
           display:grid; place-items:center; color:rgba(157,179,166,.85); font-size:15px; line-height:1; }
  .check.on { background:#4CAF87; border-color:#4CAF87; color:#0F1512; font-size:14px; font-weight:700; }
  .bars { display:flex; align-items:flex-end; gap:2px; height:12px; }
  .bars i { width:2.5px; background:#4CAF87; border-radius:2px; display:block; }
  .card .bottom { display:flex; align-items:center; gap:4px; }
  .card .name { color:#EAF2EC; font-size:16px; font-weight:700; flex:1; white-space:nowrap; overflow:hidden; }
  .play { width:30px; height:30px; border-radius:50%; border:1.2px solid rgba(157,179,166,.32);
          background:transparent; display:grid; place-items:center; flex:none; }
  .play svg path, .play svg { fill:rgba(234,242,236,.66); }
  .play.on { background:rgba(76,175,135,.20); border:1.5px solid rgba(76,175,135,.60); }
  .play.on svg { fill:#4CAF87; }
  /* 已加入 / 试听态 */
  .card.inmix { border-color:rgba(76,175,135,.45); }
  .card.active { border:1.6px solid rgba(76,175,135,.65); box-shadow:0 5px 16px rgba(76,175,135,.20); }
  /* 迷你播放条 */
  .mini { margin:0 16px; height:64px; border-radius:16px; background:#182018; border:1px solid rgba(234,242,236,.08);
          display:flex; align-items:center; gap:12px; padding:0 12px 0 14px; }
  .mini .art { width:36px; height:36px; border-radius:10px; background:rgba(76,175,135,.16); display:grid; place-items:center; }
  .mini .txt { flex:1; }
  .mini .txt b { display:block; color:#EAF2EC; font-size:13.5px; font-weight:600; }
  .mini .txt span { color:#9DB3A6; font-size:11.5px; }
  .mini .big { width:44px; height:44px; border-radius:22px; background:#4CAF87; display:grid; place-items:center; }
  /* Tab */
  .tabs { display:flex; justify-content:space-around; padding:10px 0 4px; margin-top:10px; border-top:1px solid rgba(234,242,236,.08); }
  .tabs div { color:#4CAF87; font-size:10.5px; text-align:center; display:grid; gap:3px; justify-items:center; }
  .tabs div.off { color:#9DB3A6; }
  .note { position:absolute; }
</style>
</head>
<body>
<div class="phone">
  <div class="status"><span>19:50</span><span>5G ▮▮▮ 70%</span></div>

  <div class="appbar">
    <h1>声音库</h1>
    <div class="actions">
      <div class="badge">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9DB3A6" stroke-width="1.8" stroke-linecap="round">
          <path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h13M20 17h0"/>
          <circle cx="15" cy="7" r="1.8"/><circle cx="9" cy="12" r="1.8"/><circle cx="18" cy="17" r="1.8"/>
        </svg>
        <i>2</i>
      </div>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9DB3A6" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="3.2"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4L18 18M18 6l-1.6 1.6M7.6 16.4L6 18"/>
      </svg>
    </div>
  </div>

  <div class="group"><b>自然</b><em>13</em></div>

  <div class="grid">
    <!-- 已加入 + 播放中 -->
    <div class="card active" style="background:radial-gradient(circle at 0% 0%,rgba(127,166,201,.30),rgba(127,166,201,.05) 62%,#1A241E)">
      <div class="top">
        <div class="tile" style="background:rgba(127,166,201,.46);border:1px solid rgba(127,166,201,.5)">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EAF2EC" stroke-width="1.8" stroke-linecap="round" stroke-opacity=".9">
            <path d="M7 13a4 4 0 1 1 1.2-7.8A5 5 0 0 1 18 7.5a3.5 3.5 0 0 1-.5 5.5"/><path d="M8.5 17l-1 2.5M12.5 17l-1 2.5M16.5 17l-1 2.5"/>
          </svg>
        </div>
        <div class="right">
          <div class="bars"><i style="height:5px"></i><i style="height:11px"></i><i style="height:7px"></i><i style="height:12px"></i></div>
          <div class="check on">✓</div>
        </div>
      </div>
      <div class="bottom">
        <div class="name">小雨</div>
        <div class="play"><svg width="14" height="14" viewBox="0 0 24 24" fill="#9DB3A6"><path d="M8 5v14l11-7z"/></svg></div>
      </div>
    </div>

    <!-- 未加入 -->
    <div class="card" style="background:radial-gradient(circle at 0% 0%,rgba(127,166,201,.30),rgba(127,166,201,.05) 62%,#1A241E)">
      <div class="top">
        <div class="tile" style="background:rgba(127,166,201,.46);border:1px solid rgba(127,166,201,.5)">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EAF2EC" stroke-width="1.8" stroke-linecap="round" stroke-opacity=".9">
            <path d="M7 13a4 4 0 1 1 1.2-7.8A5 5 0 0 1 18 7.5a3.5 3.5 0 0 1-.5 5.5"/><path d="M7.5 16l-1.5 4M11.5 16l-1.5 4M15.5 16l-1.5 4M19 16l-1.5 4"/>
          </svg>
        </div>
        <div class="right"><div class="check">+</div></div>
      </div>
      <div class="bottom">
        <div class="name">大雨</div>
        <div class="play"><svg width="14" height="14" viewBox="0 0 24 24" fill="#9DB3A6"><path d="M8 5v14l11-7z"/></svg></div>
      </div>
    </div>

    <!-- 雷声 -->
    <div class="card" style="background:radial-gradient(circle at 0% 0%,rgba(142,155,179,.30),rgba(142,155,179,.05) 62%,#1A241E)">
      <div class="top">
        <div class="tile" style="background:rgba(142,155,179,.46);border:1px solid rgba(142,155,179,.5)">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EAF2EC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".9">
            <path d="M7 12a4 4 0 1 1 1.2-7.8A5 5 0 0 1 18 6.5a3.5 3.5 0 0 1-.5 5.5"/><path d="M13 12l-3 5h3.5l-1 4.5"/>
          </svg>
        </div>
        <div class="right"><div class="check">+</div></div>
      </div>
      <div class="bottom"><div class="name">雷声</div>
        <div class="play"><svg width="14" height="14" viewBox="0 0 24 24" fill="#9DB3A6"><path d="M8 5v14l11-7z"/></svg></div>
      </div>
    </div>

    <!-- 风：试听中 -->
    <div class="card" style="border:1.6px solid rgba(76,175,135,.65);box-shadow:0 5px 16px rgba(76,175,135,.20);background:radial-gradient(circle at 0% 0%,rgba(169,196,184,.30),rgba(169,196,184,.05) 62%,#1A241E)">
      <div class="top">
        <div class="tile" style="background:rgba(169,196,184,.46);border:1px solid rgba(76,175,135,.55)">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4CAF87" stroke-width="1.8" stroke-linecap="round" stroke-opacity=".9">
            <path d="M4 9h9a3 3 0 1 0-3-3M4 14h13a3 3 0 1 1-3 3M4 19h6"/>
          </svg>
        </div>
        <div class="right"><div class="check on">✓</div></div>
      </div>
      <div class="bottom"><div class="name">风</div>
        <div class="play on"><svg width="14" height="14" viewBox="0 0 24 24" fill="#4CAF87"><rect x="7" y="7" width="10" height="10" rx="2"/></svg></div>
      </div>
    </div>

    <!-- 溪流 -->
    <div class="card" style="background:radial-gradient(circle at 0% 0%,rgba(111,181,201,.30),rgba(111,181,201,.05) 62%,#1A241E)">
      <div class="top">
        <div class="tile" style="background:rgba(111,181,201,.46);border:1px solid rgba(111,181,201,.5)">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EAF2EC" stroke-width="1.8" stroke-linecap="round" stroke-opacity=".9">
            <path d="M4 8h13M4 12h16M4 16h11"/><path d="M17 8l3 0"/>
          </svg>
        </div>
        <div class="right"><div class="check">+</div></div>
      </div>
      <div class="bottom"><div class="name">溪流</div>
        <div class="play"><svg width="14" height="14" viewBox="0 0 24 24" fill="#9DB3A6"><path d="M8 5v14l11-7z"/></svg></div>
      </div>
    </div>

    <!-- 海浪 -->
    <div class="card" style="background:radial-gradient(circle at 0% 0%,rgba(111,181,201,.30),rgba(111,181,201,.05) 62%,#1A241E)">
      <div class="top">
        <div class="tile" style="background:rgba(111,181,201,.46);border:1px solid rgba(111,181,201,.5)">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EAF2EC" stroke-width="1.8" stroke-linecap="round" stroke-opacity=".9">
            <path d="M3 9c2.5-2.5 4.5-2.5 7 0s4.5 2.5 7 0"/><path d="M3 14c2.5-2.5 4.5-2.5 7 0s4.5 2.5 7 0"/><path d="M3 19c2.5-2.5 4.5-2.5 7 0s4.5 2.5 7 0"/>
          </svg>
        </div>
        <div class="right"><div class="check">+</div></div>
      </div>
      <div class="bottom"><div class="name">海浪</div>
        <div class="play"><svg width="14" height="14" viewBox="0 0 24 24" fill="#9DB3A6"><path d="M8 5v14l11-7z"/></svg></div>
      </div>
    </div>

    <!-- 鸟鸣 -->
    <div class="card" style="background:radial-gradient(circle at 0% 0%,rgba(127,191,142,.30),rgba(127,191,142,.05) 62%,#1A241E)">
      <div class="top">
        <div class="tile" style="background:rgba(127,191,142,.46);border:1px solid rgba(127,191,142,.5)">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EAF2EC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".9">
            <path d="M4 15c3-6 8-6 10-2 1 2 3 2 6 1-1 3-4 5-8 5-4 0-7-1.5-8-4z"/><path d="M15 12.5l3-4"/>
          </svg>
        </div>
        <div class="right"><div class="check">+</div></div>
      </div>
      <div class="bottom"><div class="name">鸟鸣</div>
        <div class="play"><svg width="14" height="14" viewBox="0 0 24 24" fill="#9DB3A6"><path d="M8 5v14l11-7z"/></svg></div>
      </div>
    </div>

    <!-- 杜鹃 -->
    <div class="card" style="background:radial-gradient(circle at 0% 0%,rgba(127,191,142,.30),rgba(127,191,142,.05) 62%,#1A241E)">
      <div class="top">
        <div class="tile" style="background:rgba(127,191,142,.46);border:1px solid rgba(127,191,142,.5)">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EAF2EC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".9">
            <path d="M5 16c2-5 6-6 9-3 1.5-1 3-1 5 0-1 3-4 5-7 5H8"/><path d="M8 18l-1 2M12 18l-1 2"/>
          </svg>
        </div>
        <div class="right"><div class="check">+</div></div>
      </div>
      <div class="bottom"><div class="name">杜鹃</div>
        <div class="play"><svg width="14" height="14" viewBox="0 0 24 24" fill="#9DB3A6"><path d="M8 5v14l11-7z"/></svg></div>
      </div>
    </div>
  </div>

  <div class="mini">
    <div class="art">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4CAF87" stroke-width="1.8" stroke-linecap="round">
        <path d="M4 10c2-2.5 4-2.5 6 0s4 2.5 6 0"/><path d="M4 15c2-2.5 4-2.5 6 0s4 2.5 6 0"/>
      </svg>
    </div>
    <div class="txt"><b>夜晚虫鸣 + 风</b><span>2 轨 · 已暂停</span></div>
    <div class="big"><svg width="18" height="18" viewBox="0 0 24 24" fill="#0F1512"><path d="M8 5v14l11-7z"/></svg></div>
  </div>

  <div class="tabs">
    <div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4CAF87" stroke-width="1.8" stroke-linecap="round"><path d="M5 10v4M9 7v10M13 9v6M17 6v12M21 10v4"/></svg>
      声音库
    </div>
    <div class="off">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9DB3A6" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h11M4 12h11M4 17h7"/><path d="M19 8v9l-4-4.5"/></svg>
      方案库
    </div>
    <div class="off">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9DB3A6" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="13" r="7.5"/><path d="M12 10v3.5l2.5 1.5M9 3.5h6"/></svg>
      计时器
    </div>
  </div>
</div>
</body>
</html>
